<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>MUSIC LiDAR 宣伝動画</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 24px; background: #070a1c; color: #dfe6ff; font: 14px/1.6 system-ui, "Noto Sans JP", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #bar { height: 10px; background: #1a2040; border-radius: 5px; overflow: hidden; margin: 12px 0; }
  #bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #5ef2ff, #ff6b9e); }
  .row { display: flex; gap: 20px; align-items: flex-start; }
  #pv { width: 270px; height: 480px; border: 1px solid #334; background: #000; flex: none; }
  #log { white-space: pre-wrap; font: 12px/1.5 ui-monospace, Consolas, monospace; color: #9aa6d8; max-height: 70vh; overflow: auto; }
</style>
</head>
<body>
<h1>MUSIC LiDAR 宣伝動画の書き出し</h1>
<div id="status">準備中…</div>
<div id="bar"><i></i></div>
<div class="row"><canvas id="pv" width="270" height="480"></canvas><div id="log"></div></div>
<script type="module">
// tools/promo.py から開くページ。tools/promo-plan.json の動画を1本ずつ作る。
// 1本 = 本編(15.5秒。難易度くらべは同じ区間を3回)+ 最後のエンド画面(2.5秒)。縦 1080×1920・30fps。
// プレイ画面はゲーム本体(game.js)ではなく、譜面から時刻ごとに描く(自動プレイ = 全部 PERFECT)。リアルタイムではないので、タブが裏にあっても止まらない。
// TikTok の画面の部品(上のタブ・右のボタン・下の説明文)に隠れないように、大事な文字は x 60〜920・y 180〜1480 に置く。
import { composeSong, candidatesFromEvents, generateChart, shapeHolds, hashStr, extraParam } from '../js/composer.js';
import { renderEvents, loudnessGain } from '../js/audio.js';
import { createMV, analyzeSections, prepareMV } from '../js/mv.js';
import { buildScroll, dropNotesInStops } from '../js/gimmick.js';
import SONGS from '../js/songs/index.js';
import EXTRA_LEVELS from '../js/songs/extra-levels.js';

const $ = (id) => document.getElementById(id);
const W = 1080, H = 1920, FPS = 30, WORKERS = 4, BATCH = 12;
const MAIN = 15.5, END = 2.5;
const CYAN = '#5ef2ff', PINK = '#ff4fd8';
const LC = [CYAN, PINK, PINK, CYAN]; // レーンの色(ゲームと同じ)
const DC = { easy: '#6dffb0', normal: '#ffd25e', hard: '#ff5a8a', extra: '#c06bff' };
const E = (window.__promo = { state: 'start', done: 0, total: 0, errors: [] });
const qs = (o) => Object.entries(o).map(([k, x]) => k + '=' + encodeURIComponent(x)).join('&');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = (k) => 1 - Math.pow(1 - k, 3);
function log(msg) { $('log').textContent += msg + '\n'; fetch('/x/log', { method: 'POST', body: msg }).catch(() => {}); }
async function post(path, body = '') {
  for (let k = 0; ; k++) {
    try { const j = await (await fetch(path, { method: 'POST', body })).json(); if (!j.ok) throw new Error(j.err || 'NG'); return j; }
    catch (e) { if (k >= 4) throw e; await new Promise((r) => setTimeout(r, 800)); }
  }
}

// ---------- 曲と譜面(main.js の builtinEntry と同じ作り方) ----------
function chartsOf(def, events, duration) {
  const cands = candidatesFromEvents(events);
  const scroll = buildScroll(def.gimmicks, def.bpm);
  const seed = hashStr(def.id);
  const holds = (n, d) => (def.holdStyle === false ? n : shapeHolds(n, d === 'extra' ? 'hard' : d, { bpm: def.bpm, level: def.levels?.[d], seed }));
  const levels = EXTRA_LEVELS[def.id] ? { ...def.levels, extra: EXTRA_LEVELS[def.id] } : { ...def.levels };
  const charts = {};
  for (const d of ['easy', 'normal', 'hard']) charts[d] = dropNotesInStops(holds(generateChart(cands, d, duration, seed, def.chart?.[d]), d), scroll.stops);
  if (levels.extra) charts.extra = dropNotesInStops(holds(generateChart(cands, 'extra', duration, seed, extraParam(def.chart?.hard, def.chart?.extra)), 'extra'), scroll.stops);
  return { charts, levels };
}
// いちばんノーツが多い区間の頭(小節単位)
function densest(notes, len, duration, bar) {
  let best = -1, bt = 0;
  for (let s = Math.max(bar * 2, duration * 0.05); s + len < duration * 0.97; s += bar) {
    let c = 0; for (const n of notes) if (n.t >= s && n.t < s + len) c++;
    if (c > best) { best = c; bt = s; }
  }
  return bt;
}

// ---------- 時間の割り当て ----------
// 動画の時刻 v → 曲の時刻・難易度。難易度くらべは同じ区間(約5秒・小節単位)を3回くり返す
function timeline(spec, def, duration) {
  const spb = 60 / def.bpm, bar = 4 * spb;
  let seg = 0, main = MAIN;
  if (spec.type === 'diff') { seg = Math.max(1, Math.round(5.2 / bar)) * bar; main = seg * 3; }
  const total = main + END;
  const need = spec.type === 'diff' ? seg + END : total;
  let from = spec.from;
  if (from == null) from = spec._auto;
  from = Math.max(0, Math.min(Math.round(from / bar) * bar, duration - need - 0.5));
  const songT = (v) => (spec.type === 'diff' ? from + (v < 2 * seg ? v % seg : v - 2 * seg) : from + v);
  const diffAt = (v) => (spec.type === 'diff' ? spec.diffs[Math.min(2, Math.floor(v / seg))] : spec.diff);
  // 区間の一覧(音の組み立てとタップ音用): [動画の頭, 長さ, 曲の頭, 難易度]
  const segs = spec.type === 'diff'
    ? [[0, seg, from, spec.diffs[0]], [seg, seg, from, spec.diffs[1]], [2 * seg, seg + END, from, spec.diffs[2]]]
    : [[0, total, from, spec.diff]];
  return { from, seg, main, total, songT, diffAt, segs };
}

// ---------- 音 ----------
function clickBuf(sr) { // タップ音(短い「カッ」)
  const n = Math.round(sr * 0.05), out = new Float32Array(n);
  let r = 12345;
  for (let i = 0; i < n; i++) {
    const t = i / sr; r = (r * 1103515245 + 12345) >>> 0;
    out[i] = Math.sin(2 * Math.PI * 2100 * t) * Math.exp(-t / 0.01) * 0.5 + ((r / 4294967296) * 2 - 1) * Math.exp(-t / 0.003) * 0.35;
  }
  return out;
}
function buildAudio(buf, tl, charts, withClicks) {
  const sr = buf.sampleRate, n = Math.ceil(tl.total * sr);
  const L = new Float32Array(n), R = new Float32Array(n);
  const sL = buf.getChannelData(0), sR = buf.numberOfChannels > 1 ? buf.getChannelData(1) : sL;
  const g = loudnessGain(buf);
  for (const [v0, len, s0] of tl.segs) {
    const a = Math.round(v0 * sr), b = Math.min(n, Math.round((v0 + len) * sr)), j0 = Math.round(s0 * sr);
    const fade = Math.round(sr * 0.012); // 継ぎ目がプツッとしないように
    for (let i = a; i < b; i++) {
      const j = j0 + (i - a);
      if (j < 0 || j >= sL.length) continue;
      const k = Math.min(1, (i - a) / fade, (b - i) / fade);
      L[i] = sL[j] * g * (tl.segs.length > 1 ? k : 1); R[i] = sR[j] * g * (tl.segs.length > 1 ? k : 1);
    }
  }
  if (withClicks) {
    const c = clickBuf(sr);
    for (const [v0, len, s0, d] of tl.segs) {
      for (const nt of charts[d]) {
        if (nt.t < s0 || nt.t >= s0 + len) continue;
        const v = v0 + (nt.t - s0);
        if (v >= tl.main) continue;
        const a = Math.round(v * sr);
        for (let i = 0; i < c.length && a + i < n; i++) { L[a + i] += c[i] * 0.22; R[a + i] += c[i] * 0.22; }
      }
    }
  }
  // 頭はすぐ、最後の 1.2 秒でフェードアウト。割れないように頭打ち
  const fi = Math.round(sr * 0.04), fo = Math.round(sr * 1.2);
  let pk = 0;
  for (let i = 0; i < n; i++) {
    const k = Math.min(1, i / fi, (n - i) / fo);
    L[i] *= k; R[i] *= k;
    pk = Math.max(pk, Math.abs(L[i]), Math.abs(R[i]));
  }
  const lim = pk > 0.98 ? 0.98 / pk : 1;
  const out = new Uint8Array(44 + n * 4), dv = new DataView(out.buffer);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); str(8, 'WAVE'); str(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true);
  str(36, 'data'); dv.setUint32(40, n * 4, true);
  for (let i = 0, o = 44; i < n; i++, o += 4) {
    dv.setInt16(o, clamp(L[i] * lim, -1, 1) * 32767, true);
    dv.setInt16(o + 2, clamp(R[i] * lim, -1, 1) * 32767, true);
  }
  return out;
}

// ---------- 文字 ----------
function text(g, s, x, y, o = {}) {
  const { size = 64, weight = 900, font = '"Noto Sans JP"', color = '#fff', glow = CYAN, blur = 26, align = 'center', maxW = 940, alpha = 1, scale = 1 } = o;
  g.save();
  g.globalAlpha = alpha;
  let sz = size;
  const f = () => `${weight} ${sz}px ${font}, "Noto Sans JP", sans-serif`;
  g.font = f();
  while (g.measureText(s).width > maxW && sz > 20) { sz -= 2; g.font = f(); }
  g.translate(x, y); g.scale(scale, scale);
  g.textAlign = align; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
  g.lineWidth = Math.max(5, sz * 0.14); g.strokeStyle = 'rgba(0,0,0,0.8)'; g.strokeText(s, 0, 0);
  g.shadowColor = glow; g.shadowBlur = blur; g.fillStyle = color; g.fillText(s, 0, 0);
  g.restore();
}
function badge(g, s, x, y, color, size = 40) { // 真ん中が x の角丸のラベル
  g.save();
  g.font = `900 ${size}px Orbitron, "Noto Sans JP", sans-serif`;
  const w = g.measureText(s).width + size * 1.1, h = size * 1.5;
  g.beginPath(); g.roundRect(x - w / 2, y - h * 0.72, w, h, h / 2);
  g.fillStyle = 'rgba(0,0,0,0.6)'; g.fill();
  g.lineWidth = 4; g.strokeStyle = color; g.shadowColor = color; g.shadowBlur = 18; g.stroke();
  g.shadowBlur = 0; g.fillStyle = color; g.textAlign = 'center'; g.fillText(s, x, y + size * 0.05);
  g.restore();
}
const pop = (v, start, len = 0.28) => { const k = clamp((v - start) / len); return { alpha: k, scale: 1.18 - 0.18 * easeOut(k) }; };

// ---------- プレイ画面(3D風の4レーン) ----------
// P: { cx, yTop, yJ, wTop, wBot, hs(ノーツが奥から来るまでの秒) }
function drawPlay(g, P, notes, s, opt = {}) {
  const { cx, yTop, yJ, wTop, wBot, hs = 1.05 } = P;
  const K = 2.3, sc = wBot / 920;
  const yAt = (z) => yJ - (yJ - yTop) * (z * (1 + K)) / (1 + K * z);
  const wAt = (y) => wTop + (wBot - wTop) * (y - yTop) / (yJ - yTop);
  const xAt = (lane, y) => { const w = wAt(y); return cx - w / 2 + (w * lane) / 4; };
  const yB = yJ + 120 * sc;
  g.save();
  // 床
  g.beginPath(); g.moveTo(xAt(0, yTop), yTop); g.lineTo(xAt(4, yTop), yTop); g.lineTo(xAt(4, yB), yB); g.lineTo(xAt(0, yB), yB); g.closePath();
  const fl = g.createLinearGradient(0, yTop, 0, yB);
  fl.addColorStop(0, 'rgba(3,5,18,0.25)'); fl.addColorStop(0.5, 'rgba(3,5,18,0.7)'); fl.addColorStop(1, 'rgba(3,5,18,0.88)');
  g.fillStyle = fl; g.fill();
  // 見えているノーツ(ロングは終わりまで)
  const vis = notes.filter((n) => (n.end ?? n.t) >= s - 0.35 && n.t <= s + hs);
  // 叩いた瞬間の光の柱
  for (const n of vis) {
    const age = s - n.t;
    if (age < 0 || age > 0.3) continue;
    const a = 1 - age / 0.3, top = yJ - (yJ - yTop) * 0.55;
    const gr = g.createLinearGradient(0, yJ, 0, top);
    gr.addColorStop(0, LC[n.lane] + 'cc'); gr.addColorStop(1, LC[n.lane] + '00');
    g.globalAlpha = a; g.fillStyle = gr;
    g.beginPath(); g.moveTo(xAt(n.lane, yJ), yJ); g.lineTo(xAt(n.lane + 1, yJ), yJ); g.lineTo(xAt(n.lane + 1, top), top); g.lineTo(xAt(n.lane, top), top); g.closePath(); g.fill();
  }
  g.globalAlpha = 1;
  // レーンの線
  for (let i = 0; i <= 4; i++) {
    const outer = i === 0 || i === 4;
    g.strokeStyle = outer ? 'rgba(94,242,255,0.95)' : 'rgba(150,180,255,0.28)';
    g.lineWidth = (outer ? 5 : 2) * sc;
    g.shadowColor = CYAN; g.shadowBlur = outer ? 18 : 0;
    g.beginPath(); g.moveTo(xAt(i, yTop), yTop); g.lineTo(xAt(i, yB), yB); g.stroke();
  }
  g.shadowBlur = 0;
  // ロングノーツの帯
  for (const n of vis) {
    if (!n.end || n.end < s) continue;
    const z0 = clamp((n.t - s) / hs), z1 = clamp((n.end - s) / hs);
    if (z1 <= z0) continue;
    const y0 = yAt(z0), y1 = yAt(z1), held = n.t <= s;
    const ins = (y) => (wAt(y) / 4) * 0.2;
    g.beginPath();
    g.moveTo(xAt(n.lane, y0) + ins(y0), y0); g.lineTo(xAt(n.lane + 1, y0) - ins(y0), y0);
    g.lineTo(xAt(n.lane + 1, y1) - ins(y1), y1); g.lineTo(xAt(n.lane, y1) + ins(y1), y1); g.closePath();
    g.fillStyle = LC[n.lane] + (held ? '99' : '55'); g.fill();
  }
  // ノーツ
  for (let i = vis.length - 1; i >= 0; i--) {
    const n = vis[i];
    const z = (n.t - s) / hs;
    if (z < 0 || z > 1) continue;
    const y = yAt(z), f = (y - yTop) / (yJ - yTop);
    const h = (8 + 28 * f) * sc, inset = (wAt(y) / 4) * 0.06;
    const x0 = xAt(n.lane, y) + inset, x1 = xAt(n.lane + 1, y) - inset;
    g.globalAlpha = 0.35 + 0.65 * clamp(f * 3);
    g.shadowColor = LC[n.lane]; g.shadowBlur = 22 * sc;
    g.fillStyle = LC[n.lane]; g.fillRect(x0, y - h / 2, x1 - x0, h);
    g.shadowBlur = 0; g.fillStyle = 'rgba(255,255,255,0.85)'; g.fillRect(x0 + (x1 - x0) * 0.1, y - h * 0.12, (x1 - x0) * 0.8, Math.max(2, h * 0.24));
  }
  g.globalAlpha = 1;
  // 判定ライン
  g.strokeStyle = '#fff'; g.lineWidth = 7 * sc; g.shadowColor = CYAN; g.shadowBlur = 24;
  g.beginPath(); g.moveTo(xAt(0, yJ) - 10, yJ); g.lineTo(xAt(4, yJ) + 10, yJ); g.stroke();
  g.shadowBlur = 0;
  // キー(D F J K)。叩いた直後とロングを押している間は光る
  const keyTop = yJ + 14 * sc, keyBot = yJ + 104 * sc;
  for (let l = 0; l < 4; l++) {
    const on = vis.some((n) => n.lane === l && ((s - n.t >= 0 && s - n.t < 0.12) || (n.end && n.t <= s && s < n.end)));
    const ins = 10 * sc;
    g.beginPath();
    g.moveTo(xAt(l, keyTop) + ins, keyTop); g.lineTo(xAt(l + 1, keyTop) - ins, keyTop); g.lineTo(xAt(l + 1, keyBot) - ins, keyBot); g.lineTo(xAt(l, keyBot) + ins, keyBot); g.closePath();
    g.fillStyle = on ? LC[l] + '88' : 'rgba(10,14,34,0.75)'; g.fill();
    g.lineWidth = 3 * sc; g.strokeStyle = LC[l] + (on ? 'ff' : '88'); g.stroke();
    g.font = `900 ${40 * sc}px Orbitron, sans-serif`; g.textAlign = 'center'; g.fillStyle = on ? '#fff' : 'rgba(220,230,255,0.8)';
    g.fillText('DFJK'[l], (xAt(l, keyBot) + xAt(l + 1, keyBot)) / 2, keyBot - 26 * sc);
  }
  // コンボと判定
  let combo = 0, last = -1;
  for (const n of notes) { if (n.t <= s) { combo++; last = n.t; } else break; }
  if (opt.combo !== false && combo > 0) {
    const y = yJ - (yJ - yTop) * 0.6;
    text(g, 'COMBO', cx, y - 120 * sc, { size: 30 * sc, font: 'Orbitron', weight: 700, color: 'rgba(220,230,255,0.85)', blur: 8, maxW: 600 });
    text(g, String(combo), cx, y, { size: 120 * sc, font: 'Orbitron', alpha: 0.92, blur: 30, maxW: 700 });
  }
  if (last >= 0 && s - last < 0.45) {
    const age = s - last, k = age < 0.1 ? 1.25 - 0.25 * (age / 0.1) : 1;
    text(g, 'PERFECT', cx, yJ - (yJ - yTop) * 0.3, { size: 76 * sc, font: 'Orbitron', color: '#fff', glow: PINK, blur: 30, scale: k, alpha: 1 - clamp((age - 0.3) / 0.15), maxW: 800 });
  }
  g.restore();
}

// ---------- ロゴ(MUSIC / LiDAR) ----------
function spaced(g, s, cx, y, sp) {
  const w = [...s].reduce((a, c) => a + g.measureText(c).width, 0) + sp * (s.length - 1);
  let x = cx - w / 2; g.textAlign = 'left';
  for (const c of s) { g.fillText(c, x, y); x += g.measureText(c).width + sp; }
  g.textAlign = 'center';
}
function wordmark(g, cx, cy, big, alpha = 1) {
  g.save(); g.globalAlpha = alpha; g.textAlign = 'center';
  g.font = `700 ${big * 0.3}px Orbitron`; g.fillStyle = '#8a97c0'; spaced(g, 'MUSIC', cx, cy - big * 0.98, big * 0.15);
  g.font = `900 ${big}px Orbitron`;
  g.globalAlpha = alpha * 0.65; g.fillStyle = PINK; g.fillText('LiDAR', cx + big * 0.035, cy);
  g.globalAlpha = alpha;
  for (const [b, a] of [[big * 0.5, 0.7], [big * 0.2, 0.9], [big * 0.07, 1]]) { g.save(); g.shadowColor = CYAN; g.shadowBlur = b; g.globalAlpha = alpha * a; g.fillStyle = '#fff'; g.fillText('LiDAR', cx, cy); g.restore(); }
  g.fillStyle = '#fff'; g.fillText('LiDAR', cx, cy);
  g.restore();
}

// ---------- 1フレーム ----------
const PLAY_BIG = { cx: 540, yTop: 560, yJ: 1390, wTop: 170, wBot: 940 };
const PLAY_SMALL = { cx: 540, yTop: 1010, yJ: 1400, wTop: 150, wBot: 760 };
function drawFrame(g, v, X) {
  const { spec, tl, def, charts, levels, mvBg, mvPanel, panel } = X;
  const s = tl.songT(v), d = tl.diffAt(v);
  // 背景: MV を全面に、少し暗く
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  if (mvBg) mvBg.draw(g, W, H, s);
  g.fillStyle = 'rgba(2,3,10,0.42)'; g.fillRect(0, 0, W, H);
  const inEnd = v >= tl.main;
  if (!inEnd || v < tl.main + 0.35) {
    const fadeK = inEnd ? 1 - (v - tl.main) / 0.35 : 1;
    g.save(); g.globalAlpha = fadeK;
    if (spec.type === 'song') {
      // 上: MV を大きく、下: プレイ画面を小さく
      const pg = panel.getContext('2d');
      pg.fillStyle = '#000'; pg.fillRect(0, 0, panel.width, panel.height);
      mvPanel?.draw(pg, panel.width, panel.height, s);
      g.save(); g.shadowColor = def.color || CYAN; g.shadowBlur = 40; g.fillStyle = '#000'; g.fillRect(60, 300, 960, 540); g.restore();
      g.drawImage(panel, 60, 300, 960, 540);
      g.lineWidth = 5; g.strokeStyle = def.color || CYAN; g.strokeRect(60, 300, 960, 540);
      drawPlay(g, PLAY_SMALL, charts[d], s, { combo: false });
      const p = pop(v, 0);
      text(g, spec.hook, 540, 240, { size: 62, alpha: p.alpha, scale: p.scale });
      text(g, '♪ ' + def.title, 540, 930, { size: 84, font: 'Orbitron', glow: def.color || CYAN, maxW: 920 });
      text(g, `${def.genre} ・ BPM ${Math.round(def.bpm)} ・ ${d.toUpperCase()} Lv${levels[d]}`, 540, 990, { size: 34, font: 'Orbitron', weight: 700, color: 'rgba(225,235,255,0.9)', blur: 6 });
    } else {
      drawPlay(g, PLAY_BIG, charts[d], s);
      if (spec.type === 'auto') {
        const p = pop(v, 0);
        text(g, spec.hook, 540, 300, { size: 96, alpha: p.alpha, scale: p.scale });
        if (spec.sub) text(g, spec.sub, 540, 380, { size: 46, color: '#ffe6f6', glow: PINK, alpha: clamp((v - 0.4) / 0.3) });
        const pk = pop(v, 0.8);
        text(g, def.title, 540, 470, { size: 50, font: 'Orbitron', alpha: pk.alpha, maxW: 640, glow: def.color || CYAN });
        badge(g, `${d.toUpperCase()} ${levels[d]}`, 540, 535, DC[d], 34);
      } else if (spec.type === 'intro') {
        const caps = spec.captions, per = tl.main / caps.length, i = Math.min(caps.length - 1, Math.floor(v / per));
        const p = pop(v, i * per, 0.22);
        text(g, caps[i][0], 540, 320, { size: 104, alpha: p.alpha, scale: p.scale });
        text(g, caps[i][1], 540, 405, { size: 46, color: '#e6f0ff', glow: PINK, alpha: clamp((v - i * per - 0.15) / 0.25) });
        text(g, `${def.title} ・ ${d.toUpperCase()} Lv${levels[d]}`, 540, 490, { size: 34, font: 'Orbitron', weight: 700, color: 'rgba(225,235,255,0.85)', blur: 6 });
      } else if (spec.type === 'diff') {
        const i = Math.min(2, Math.floor(v / tl.seg)), t0 = i * tl.seg;
        text(g, spec.hook, 540, 240, { size: 60, alpha: pop(v, 0).alpha });
        const p = pop(v, t0, 0.22);
        text(g, `${d.toUpperCase()}  Lv${levels[d]}`, 540, 380, { size: 118, font: 'Orbitron', color: '#fff', glow: DC[d], blur: 40, alpha: p.alpha, scale: p.scale });
        // EASY → HARD → EXTRA の進み具合
        g.save();
        spec.diffs.forEach((dd, k) => {
          const x = 540 + (k - 1) * 230;
          g.font = '900 34px Orbitron'; g.textAlign = 'center';
          g.fillStyle = k === i ? DC[dd] : 'rgba(200,210,240,0.35)';
          g.shadowColor = DC[dd]; g.shadowBlur = k === i ? 16 : 0;
          g.fillText(dd.toUpperCase(), x, 470);
          if (k < 2) { g.shadowBlur = 0; g.fillStyle = 'rgba(200,210,240,0.5)'; g.fillText('→', x + 115, 470); }
        });
        g.restore();
        text(g, def.title, 540, 530, { size: 34, font: 'Orbitron', weight: 700, color: 'rgba(225,235,255,0.85)', blur: 6 });
        const fl = 1 - clamp((v - t0) / 0.2); // 切り替えの瞬間に白く光る
        if (i > 0 && fl > 0) { g.fillStyle = `rgba(255,255,255,${fl * 0.45})`; g.fillRect(0, 0, W, H); }
      }
    }
    g.restore();
    text(g, 'music-lidar.com', 540, 1560, { size: 34, font: 'Orbitron', weight: 700, color: 'rgba(230,240,255,0.85)', blur: 8 });
  }
  if (inEnd) {
    // エンド画面: ロゴと「ブラウザで無料」「music-lidar.com」
    const k = clamp((v - tl.main) / 0.35);
    g.fillStyle = `rgba(2,3,10,${0.72 * k})`; g.fillRect(0, 0, W, H);
    const p = pop(v, tl.main + 0.1, 0.4);
    g.save(); g.translate(540, 820); g.scale(p.scale, p.scale); g.translate(-540, -820); wordmark(g, 540, 820, 230, p.alpha); g.restore();
    text(g, '4KEY RHYTHM SCANNER', 540, 930, { size: 34, font: 'Orbitron', weight: 700, color: CYAN, blur: 10, alpha: p.alpha });
    text(g, 'ブラウザで無料・インストール不要', 540, 1080, { size: 58, alpha: clamp((v - tl.main - 0.4) / 0.3) });
    text(g, 'music-lidar.com', 540, 1190, { size: 72, font: 'Orbitron', color: CYAN, glow: CYAN, alpha: clamp((v - tl.main - 0.6) / 0.3) });
    text(g, 'で検索 ・ プロフィールのリンクから', 540, 1265, { size: 38, color: '#e6f0ff', blur: 6, alpha: clamp((v - tl.main - 0.8) / 0.3) });
  }
}

// ---------- JPEG 変換(Worker) ----------
const WSRC = `const oc = new OffscreenCanvas(${W}, ${H}), cx = oc.getContext('2d');
onmessage = async (e) => {
  cx.putImageData(new ImageData(new Uint8ClampedArray(e.data.buf), ${W}, ${H}), 0, 0);
  const ab = await (await oc.convertToBlob({ type: 'image/jpeg', quality: 0.9 })).arrayBuffer();
  postMessage({ id: e.data.id, ab }, [ab]);
};`;
const wurl = URL.createObjectURL(new Blob([WSRC], { type: 'text/javascript' }));
const pool = Array.from({ length: WORKERS }, () => {
  const w = new Worker(wurl), pend = new Map();
  w.onmessage = (e) => { pend.get(e.data.id)(new Uint8Array(e.data.ab)); pend.delete(e.data.id); };
  return { w, pend };
});
let jid = 0;
function encode(buf) { const p = pool[jid % WORKERS], id = ++jid; return new Promise((r) => { p.pend.set(id, r); p.w.postMessage({ id, buf }, [buf]); }); }

async function makeVideo(spec, idx) {
  const def = SONGS.find((x) => x.id === spec.id);
  if (!def) throw new Error('曲が見つかりません: ' + spec.id);
  if (def.audio) throw new Error('ほかの作者さんの曲は使えません: ' + spec.id);
  const name = `promo-${String(idx + 1).padStart(2, '0')}-${spec.type}-${def.id}`;
  $('status').textContent = `${name}: 曲を合成中…`;
  const { events, duration } = composeSong(def);
  const { charts, levels } = chartsOf(def, events, duration);
  const bar = 240 / def.bpm;
  for (const d of [spec.diff, ...(spec.diffs || [])].filter(Boolean)) if (!charts[d]) throw new Error(`${def.id} に ${d} の譜面がありません`);
  spec._auto = spec.type === 'auto' ? densest(charts[spec.diff], MAIN, duration, bar) : (def.preview ?? 32) * 60 / def.bpm;
  const tl = timeline(spec, def, duration);
  const buf = await renderEvents(events, duration, { sidechain: !!def.sidechain });
  await post('/x/wav?' + qs({ name }), buildAudio(buf, tl, charts, spec.type !== 'song'));
  // MV(背景用と、曲の紹介の上の画面用)
  await prepareMV(def.id);
  const auto = { title: def.title, genre: def.genre, color: def.color, sections: analyzeSections(events, def.bpm, duration) };
  const mvBg = createMV(def.id, def.bpm, 0, { scale: 0.5, maxW: 540 }, auto);
  const mvPanel = spec.type === 'song' ? createMV(def.id, def.bpm, 0, { scale: 0.75, maxW: 960 }, auto) : null;
  const panel = document.createElement('canvas'); panel.width = 960; panel.height = 540;
  const X = { spec, tl, def, charts, levels, mvBg, mvPanel, panel };
  await post('/x/vstart?' + qs({ name, fps: FPS, title: `MUSIC LiDAR - ${def.title}` }));
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d', { willReadFrequently: true });
  const pv = $('pv').getContext('2d');
  const N = Math.ceil(tl.total * FPS);
  const inflight = []; let parts = [], size = 0;
  const flush = async () => {
    const body = new Uint8Array(size); let o = 0;
    for (const p of parts) { body.set(p, o); o += p.length; }
    parts = []; size = 0;
    await post('/x/vframe?' + qs({ name }), body);
  };
  const t0 = performance.now();
  for (let f = 0; f < N; f++) {
    drawFrame(g, f / FPS, X);
    inflight.push(encode(g.getImageData(0, 0, W, H).data.buffer));
    if (inflight.length >= WORKERS * 2) { const j = await inflight.shift(); parts.push(j); size += j.length; }
    if (parts.length >= BATCH) await flush();
    if (f % 15 === 0) {
      pv.drawImage(cv, 0, 0, 270, 480);
      $('status').textContent = `${name}: ${f}/${N} フレーム(${Math.round(f / ((performance.now() - t0) / 1000 + 1e-3))} fps)`;
    }
  }
  while (inflight.length) { const j = await inflight.shift(); parts.push(j); size += j.length; }
  if (parts.length) await flush();
  await post('/x/vend?' + qs({ name }));
  log(`作成 ${name}(${tl.total.toFixed(1)}秒・曲の ${tl.from.toFixed(1)}秒から)`);
}

async function main() {
  await Promise.all(['900 100px Orbitron', '700 100px Orbitron', '900 100px "Noto Sans JP"', '700 100px "Noto Sans JP"'].map((f) => document.fonts.load(f, 'MUSIC LiDAR 叩ける無料音ゲーの曲')));
  const cfg = await (await fetch('/x/config')).json();
  const plan = await (await fetch('promo-plan.json', { cache: 'no-store' })).json();
  const list = plan.map((s, i) => [s, i]).filter(([, i]) => !cfg.only.length || cfg.only.includes(i + 1));
  E.total = list.length;
  log(`書き出し先 ${cfg.out} ・ ${list.length}本`);
  for (const [spec, i] of list) {
    try { await makeVideo(spec, i); }
    catch (e) { E.errors.push(spec.id + ': ' + e); log(`失敗 ${i + 1}番 ${spec.id}: ${e}`); console.error(e); }
    E.done++;
    $('bar').firstElementChild.style.width = (E.done / Math.max(1, E.total)) * 100 + '%';
  }
  E.state = 'done';
  const msg = E.errors.length ? `完了(失敗 ${E.errors.length}件)` : '完了';
  $('status').textContent = msg + '。このタブは閉じて大丈夫です';
  await fetch('/x/done', { method: 'POST', body: `ページ側の処理が${msg}` });
}
main().catch((e) => { E.state = 'error'; E.errors.push(String(e)); log('エラー: ' + e); fetch('/x/done', { method: 'POST', body: 'エラー: ' + e }); });
</script>
